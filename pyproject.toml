[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-pocket-games"
version = "1.0.0"
description = "Retro game collection for Raspberry Pi handheld"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "tfroehlich82" }]
dependencies = [
    "pygame-ce>=2.4.0",
]

[project.scripts]
pocket-games = "pocket_games.main:main"

[tool.setuptools.packages.find]
include = ["pocket_games*"]