name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller ruff

      - name: Run Unit Tests
        run: python -m unittest discover -s tests

      - name: Lint Code
        run: ruff check .

      - name: Build Executable
        run: pyinstaller --noconsole --onefile --name pocket-games pocket_games/main.py

      - name: Package Linux Archive
        run: tar -czvf pocket-games-linux.tar.gz dist/pocket-games README.md

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pocket-games-linux
          path: pocket-games-linux.tar.gz

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller ruff

      - name: Build Executable
        run: pyinstaller --noconsole --onefile --name pocket-games pocket_games/main.py

      - name: Package Windows Archive
        shell: pwsh
        run: Compress-Archive -Path dist/pocket-games.exe, README.md -DestinationPath pocket-games-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pocket-games-windows
          path: pocket-games-windows.zip

  release:
    name: Create GitHub Release & Upload Assets
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pocket-games-linux.tar.gz
            artifacts/pocket-games-windows.zip
